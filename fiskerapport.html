<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎣 Fiskerapport</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:#e2e8f0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

h1{
    text-align:center;
    color:#60a5fa;
}

label{
    display:block;
    margin-top:10px;
}

input,
select,
textarea{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
    box-sizing:border-box;
}

textarea{
    min-height:100px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    cursor:pointer;
    margin-right:10px;
}

button:hover{
    background:#16a34a;
}

#reports{
    margin-top:20px;
}

.report-card{
    border-top:1px solid #475569;
    padding-top:15px;
    margin-top:15px;
}

.method{
    width:auto;
    margin-right:8px;
}
.size-group{
    display:flex;
    gap:15px;
    margin-top:5px;
    margin-bottom:35px;
    align-items:center;
}

.size-group label{
    display:inline-flex;
    align-items:center;
    gap:3px;
    margin:0;
}

.size-group input{
    width:auto;
    margin:0;
}

#rating{
    margin-top:5px;
}

.method-group{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:5px;
    margin-bottom:35px;
}

.method-group label{
    display:inline-flex;
    align-items:center;
    gap:3px;
    margin:0;
}

.method-group input{
    width:auto;
    margin:0;
}
</style>
</head>

<body>

<div class="container">

<h1>🎣 Fiskerapport</h1>

<label>Datum</label>
<input type="date" id="date">

<label>Fiskevatten</label>
<input type="text" id="place" value="Fryken">

<label>Starttid</label>
<input type="text" id="startTime" placeholder="18:00">

<label>Sluttid</label>
<input type="text" id="endTime" placeholder="22:00">

<label>Gäddor</label>
<input type="number" id="pike" value="0">

<div class="size-group">

<label><input type="checkbox" class="pikeSize" value="Små">Små</label>

<label><input type="checkbox" class="pikeSize" value="Medel">Medel</label>

<label><input type="checkbox" class="pikeSize" value="Stora">Stora</label>

</div>

<label>Abborrar</label>
<input type="number" id="perch" value="0">

<div class="size-group">

<label>
<input type="checkbox" class="perchSize" value="Små">
Små
</label>

<label>
<input type="checkbox" class="perchSize" value="Medel">
Medel
</label>

<label>
<input type="checkbox" class="perchSize" value="Stora">
Stora
</label>

</div>

<label>Gösar</label>
<input type="number" id="zander" value="0">


<div class="size-group">

<label><input type="checkbox" class="zanderSize" value="Små">Små</label>

<label><input type="checkbox" class="zanderSize" value="Medel">Medel</label>

<label><input type="checkbox" class="zanderSize" value="Stora">Stora</label>

</div>

<label style="margin-top:20px;">Fiskesätt</label>

<div class="method-group">

<label><input type="checkbox" class="method" value="Spinnfiske">Spinnfiske</label>

<label><input type="checkbox" class="method" value="Jigg">Jigg</label>

<label><input type="checkbox" class="method" value="Trolling">Trolling</label>

<label><input type="checkbox" class="method" value="Mete">Mete</label>

<label><input type="checkbox" class="method" value="Fluga">Fluga</label>

<label><input type="checkbox" class="method" value="Vertikal">Vertikal</label>

<label><input type="checkbox" class="method" value="Annat">Annat</label>

</div>

<label style="margin-top:20px;">Fiskeupplevelse</label>

<select id="rating">
    <option>Mycket dåligt</option>
    <option>Dåligt</option>
    <option selected>Normalt</option>
    <option>Bra</option>
    <option>Mycket bra</option>
</select>

<label>Kommentar</label>

<textarea id="comment"></textarea>

<button onclick="saveReport()">
💾 Spara rapport
</button>

<button
    id="reportsButton"
    onclick="showReports()">
    📊 Visa rapporter
</button>

<div id="reports"></div>

</div>

<script>

function saveReport(){

    const prediction =
        JSON.parse(
            localStorage.getItem(
                "latestFishingPrediction"
            ) || "{}"
        );

    const methods =
        Array.from(
            document.querySelectorAll(".method:checked")
        ).map(x => x.value);
const pikeSizes =
    Array.from(
        document.querySelectorAll(".pikeSize:checked")
    ).map(x => x.value);

const perchSizes =
    Array.from(
        document.querySelectorAll(".perchSize:checked")
    ).map(x => x.value);

const zanderSizes =
    Array.from(
        document.querySelectorAll(".zanderSize:checked")
    ).map(x => x.value);
    const report = {

        datum:
            document.getElementById("date").value,

fiskevatten:
    document.getElementById("place").value,

        startTid:
            document.getElementById("startTime").value,

        slutTid:
            document.getElementById("endTime").value,

        fiskesatt:
            methods,
gaddaStorlek:
    pikeSizes,

abborreStorlek:
    perchSizes,

gosStorlek:
    zanderSizes,
        gadda:
            Number(
                document.getElementById("pike").value
            ),

        abborre:
            Number(
                document.getElementById("perch").value
            ),

        gos:
            Number(
                document.getElementById("zander").value
            ),

        betyg:
            document.getElementById("rating").value,

        kommentar:
            document.getElementById("comment").value,

        prognos:
            prediction
    };

    let reports =
        JSON.parse(
            localStorage.getItem(
                "fishingReports"
            ) || "[]"
        );

    reports.push(report);

    localStorage.setItem(
        "fishingReports",
        JSON.stringify(reports)
    );

    alert("✅ Rapport sparad");

location.reload();
}

function showReports(){

    const reportsDiv =
        document.getElementById("reports");

    const button =
        document.getElementById("reportsButton");

    if(reportsDiv.innerHTML.trim() !== ""){

        reportsDiv.innerHTML = "";

        button.textContent =
            "📊 Visa rapporter";

        return;

    }

    const reports =
        JSON.parse(
            localStorage.getItem(
                "fishingReports"
            ) || "[]"
        );

    let html = "";

    reports.slice().reverse().forEach(r => {

        html += `

        <div class="report-card">

        <strong>${r.datum || "-"}</strong><br>

🌊 Fiskevatten:
${r.fiskevatten || "-"}<br>

        🕓 Fisketid:
        ${r.startTid || "-"} - ${r.slutTid || "-"}<br><br>

        🎣 Fiskesätt:
        ${r.fiskesatt?.join(", ") || "-"}<br><br>

🐊 Gädda:
${r.gadda}
(${r.gaddaStorlek?.join(", ") || "-"})<br>

🐟 Abborre:
${r.abborre}
(${r.abborreStorlek?.join(", ") || "-"})<br>

🐟 Gös:
${r.gos}
(${r.gosStorlek?.join(", ") || "-"})<br><br>
        🎣 Betyg:
        ${r.betyg}<br><br>

        <strong>Prognosdata</strong><br>

        Gädda:
        ${r.prognos?.pikeScore ?? "-"}<br>

        Abborre:
        ${r.prognos?.perchScore ?? "-"}<br>

        Gös:
        ${r.prognos?.zanderScore ?? "-"}<br>

        Lufttryck:
        ${r.prognos?.pressure ?? "-"} hPa<br>
Väder:
${r.prognos?.weather ?? "-"}<br>
        Vind:
        ${r.prognos?.wind ?? "-"} m/s<br>

        Regn:
        ${r.prognos?.rain ?? "-"} mm<br>

        Vattentemperatur:
        ${r.prognos?.waterTemp ?? "-"} °C<br>

        Prognossäkerhet:
        ${r.prognos?.confidence ?? "-"}<br><br>

        📝 Kommentar:<br>
        ${r.kommentar || "-"}<br>

        </div>

        `;

    });
button.textContent =
    "❌ Dölj rapporter";
    reportsDiv.innerHTML = html;

}


document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

</script>

</body>
</html>
